name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Node.js ${{ matrix.node }} einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero-Dependency: kein "npm install" nötig, direkt der Node-Test-Runner.
      - name: Tests ausführen
        run: node --test
